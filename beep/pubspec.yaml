name: beep
description: A new Flutter project for University transportation.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  flutter_riverpod: ^2.4.0
  go_router: ^12.0.0
  google_maps_flutter: ^2.5.0
  firebase_auth: ^4.14.0
  firebase_core: ^2.22.0
  google_fonts: ^6.1.0
  # Package for managing location permissions and getting location
  geolocator: ^10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
